name: nlistid-results

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/nlistid-results.yml'
      - '.github/actions/build-package/**'
      - 'nlistid-results/src/**'
  workflow_dispatch:

permissions: {}

env:
  VERSION: 2.1.2

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build
        uses: ./.github/actions/build-package
        with:
          testProject: nlistid-results/src/Nlist.Results.Test/Nlist.Results.Test.csproj
          projects: |
            nlistid-results/src/Nlist.Results.Abstractions/Nlist.Results.Abstractions.csproj
            nlistid-results/src/Nlist.Results/Nlist.Results.csproj
            nlistid-results/src/Nlist.Results.AspNetCore/Nlist.Results.AspNetCore.csproj
          version: ${{ env.VERSION }}

      - name: Upload the packages
        uses: actions/upload-artifact@v7
        with:
          name: nupkgs
          path: nupkgs/*.nupkg
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      packages: write

    steps:
      - name: Download the packages
        uses: actions/download-artifact@v8
        with:
          name: nupkgs
          path: nupkgs

      # GitHub Packages answers 409 Conflict for a version it already has, and
      # --skip-duplicate passes over it, so a run without a bump publishes nothing.
      - name: Push to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          dotnet nuget push "nupkgs/*.nupkg" \
            --source https://nuget.pkg.github.com/nlistid/index.json \
            --api-key "$GITHUB_TOKEN" \
            --skip-duplicate
